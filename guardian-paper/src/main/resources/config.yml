# Guardian production configuration schema.
# On initial startup, malformed/structurally invalid files are first preserved as
# timestamped .bak files before Guardian restores this packaged default. Reload never
# rewrites an invalid candidate; the prior known-good runtime snapshot remains active.
schema-version: 1

features:
  # Admission and Protection are independent domains. Phase 1B implements
  # Paper-authoritative Protection without making either domain depend on the other.
  admission:
    enabled: true
  protection:
    enabled: false

locale:
  # Locale resources are loaded from plugins/Guardian/locales/<id>.properties.
  # en_us is always the required fallback catalog.
  default: en_us

messages:
  # Shown as plain, safely inserted text where a locale template includes <help_url>.
  help-url: "https://www.badwolfmc.com/"

admission:
  # standalone: Guardian-Paper is authoritative.
  # velocity: Guardian-Velocity is authoritative and Paper verifies only the
  # trusted proxy admission assertion. Phase 5 will finalize proxy provisioning UX.
  authority: standalone

  standalone:
    # These retain the Phase 0A live-tested transport values. They are runtime
    # settings, not protocol constants, and may be retuned without a schema bump.
    handshake-timeout-seconds: 10
    challenge-channel-wait-ticks: 40

  # Minimal Phase 1A client-class policy. Named profiles and full Fabric mod
  # policy remain deliberately deferred to Phase 3.
  clients:
    bedrock: ALLOW
    vanilla: ALLOW
    optifine: ALLOW
    fabric: REQUIRE_CERBERUS
    unknown: DENY

  # Exact normalized rules apply only after a Java connection remains UNKNOWN.
  # ALLOWLIST requires clients.unknown=DENY; DENYLIST requires clients.unknown=ALLOW.
  # This preserves BrandBlocker-style allow/deny control without substring matching.
  unknown-brands:
    mode: ALLOWLIST
    brands: []

# Guardian Protection is Paper-authoritative and applies only to commands initiated
# through Paper's player command path. Console, command-block, and ordinary plugin
# dispatch are not intercepted by Guardian Protection.
protection:
  execution:
    # Security boundary for configured player command roots. This is intentionally
    # a deny list: listed roots are cancelled before third-party command execution.
    enabled: true
    blocked-roots:
      - "?"
      - about
      - icanhasbukkit
      - pl
      - plugins
      - ver
      - version

  visibility:
    # Disclosure/UX policy only; execution rules above remain authoritative.
    # ALLOWLIST exposes only listed roots. DENYLIST hides listed roots.
    enabled: true
    mode: DENYLIST
    roots:
      - "?"
      - about
      - bukkit:?
      - bukkit:about
      - bukkit:help
      - bukkit:pl
      - bukkit:plugins
      - bukkit:ver
      - bukkit:version
      - help
      - icanhasbukkit
      - pl
      - plugins
      - ver
      - version
    # Enables guardian.protection.visibility.bypass.<normalized-command-key>.
    per-command-bypass: true

  namespaces:
    # Governs direct player invocation of namespace:command roots.
    # ALLOWLIST denies every namespaced root not explicitly listed.
    # DENYLIST denies only roots explicitly listed.
    enabled: true
    mode: DENYLIST
    roots:
      - bukkit:?
      - bukkit:about
      - bukkit:help
      - bukkit:pl
      - bukkit:plugins
      - bukkit:ver
      - bukkit:version

  notifications:
    # Online staff with guardian.protection.notify receive denial notices.
    # Notification permission never grants a bypass.
    enabled: true
