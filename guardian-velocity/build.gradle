plugins {
    id 'java-library'
}

dependencies {
    implementation project(':guardian-core')
    implementation project(':guardian-protocol')

    compileOnly "com.velocitypowered:velocity-api:${velocity_api_version}"
    annotationProcessor "com.velocitypowered:velocity-api:${velocity_api_version}"
    compileOnly "org.geysermc.geyser:api:${geyser_api_version}"
    compileOnly "org.geysermc.floodgate:api:${floodgate_api_version}"

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

base {
    archivesName = 'guardian-velocity'
}

tasks.named('jar') {
    dependsOn project(':guardian-core').tasks.named('classes')
    dependsOn project(':guardian-protocol').tasks.named('classes')
    from(project(':guardian-core').sourceSets.main.output)
    from(project(':guardian-protocol').sourceSets.main.output)
}
